<title>Arbiter — Dashboard Prototype</title>
<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --panel-hover: #f5f3ee;
    --ink: #26241f;
    --muted: #6e6a61;
    --faint: #8a8578;
    --neutral: #8a8578;
    --line: #e7e3da;
    --line-strong: #d8d3c6;
    --accent: #8a6d26;
    --accent-soft: #f3ecdb;
    --done: #2e7d4f;
    --flight: #2563eb;
    --blocked: #c0392b;
    --dropped: #c65a11;
    --needs-review: #7c3aed;
    --todo: #ffffff;
    --todo-ring: #cfcabd;
    --todo-mark: #b3ada0;
    --code-bg: #f4f2ec;
    --shadow: 0 1px 2px rgba(38, 36, 31, 0.05), 0 4px 14px rgba(38, 36, 31, 0.05);

    --serif: "Iowan Old Style", "Palatino", Georgia, ui-serif, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --panel: #1c1f26;
      --panel-hover: #232732;
      --ink: #e8e6e1;
      --muted: #9a968c;
      --faint: #767268;
      --neutral: #7e7a70;
      --line: #2a2e37;
      --line-strong: #363b47;
      --accent: #c9a45c;
      --accent-soft: #2a2618;
      --done: #4caf7d;
      --flight: #6a9bff;
      --blocked: #e5675f;
      --todo: #ffffff;
      --todo-ring: rgba(255, 255, 255, 0.28);
      --todo-mark: #f0eee8;
      --code-bg: #191c22;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171c;
    --panel: #1c1f26;
    --panel-hover: #232732;
    --ink: #e8e6e1;
    --muted: #9a968c;
    --faint: #767268;
    --neutral: #7e7a70;
    --line: #2a2e37;
    --line-strong: #363b47;
    --accent: #c9a45c;
    --accent-soft: #2a2618;
    --done: #4caf7d;
    --flight: #6a9bff;
    --blocked: #e5675f;
    --dropped: #ef8e4d;
    --needs-review: #a78bfa;
    --todo: #ffffff;
    --todo-ring: rgba(255, 255, 255, 0.28);
    --todo-mark: #f0eee8;
    --code-bg: #191c22;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  }
  :root[data-theme="light"] {
    --bg: #faf9f6;
    --panel: #ffffff;
    --panel-hover: #f5f3ee;
    --ink: #26241f;
    --muted: #6e6a61;
    --faint: #8a8578;
    --neutral: #8a8578;
    --line: #e7e3da;
    --line-strong: #d8d3c6;
    --accent: #8a6d26;
    --accent-soft: #f3ecdb;
    --done: #2e7d4f;
    --flight: #2563eb;
    --blocked: #c0392b;
    --dropped: #c65a11;
    --needs-review: #7c3aed;
    --todo: #ffffff;
    --todo-ring: #cfcabd;
    --todo-mark: #b3ada0;
    --code-bg: #f4f2ec;
    --shadow: 0 1px 2px rgba(38, 36, 31, 0.05), 0 4px 14px rgba(38, 36, 31, 0.05);
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; text-wrap: balance; margin: 0; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px 80px; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 22px 0 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .nav-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
    font-size: 14px; line-height: 1; font-family: var(--sans);
  }
  .nav-toggle:hover { background: var(--panel-hover); color: var(--accent); }
  .wordmark { display: flex; align-items: center; gap: 11px; color: var(--ink); }
  .wordmark:hover { text-decoration: none; }
  .seal { flex: none; display: block; color: var(--accent); }
  .wordmark-text { display: flex; flex-direction: column; }
  .wordmark-name {
    font-family: var(--serif); font-size: 21px; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase; line-height: 1.15;
  }
  .wordmark-tag { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .topbar-meta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .capture-stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .capture-stamp b { color: var(--ink); font-weight: 600; }
  .legend { display: flex; gap: 12px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); letter-spacing: 0.03em; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.done { background: var(--done); }
  .dot.in-flight { background: var(--flight); }
  .dot.blocked { background: var(--blocked); }
  .dot.dropped { background: var(--dropped); }
  .dot.needs-review { background: var(--needs-review); }
  .dot.todo { background: var(--todo); box-shadow: 0 0 0 1px var(--todo-ring); }
  .dot.logged { background: var(--line-strong); }

  /* ---------- Status pills ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
    padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .pill .dot { width: 7px; height: 7px; }
  .pill.done    { color: var(--done);    background: color-mix(in srgb, var(--done) 11%, transparent); }
  .pill.in-flight { color: var(--flight); background: color-mix(in srgb, var(--flight) 11%, transparent); }
  .pill.blocked { color: var(--blocked); background: color-mix(in srgb, var(--blocked) 11%, transparent); }
  .pill.dropped { color: var(--dropped); background: color-mix(in srgb, var(--dropped) 11%, transparent); }
  .pill.needs-review { color: var(--needs-review); background: color-mix(in srgb, var(--needs-review) 11%, transparent); }
  .pill.todo    { color: #57534a; background: var(--todo); box-shadow: inset 0 0 0 1px var(--todo-ring); }
  .pill.todo .dot { box-shadow: inset 0 0 0 1.5px #b3ada0; }

  /* ---------- Layout: sidenav + main ---------- */
  .layout { display: flex; gap: 30px; align-items: flex-start; }
  .sidenav {
    width: 224px; flex: none;
    position: sticky; top: 16px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 2px 0 24px;
    font-size: 13px;
  }
  .layout.nav-collapsed .sidenav { display: none; }
  .nav-link {
    display: block; padding: 5px 10px; border-radius: 6px;
    color: var(--muted); font-weight: 600;
  }
  .nav-link:hover { background: var(--panel-hover); text-decoration: none; }
  .nav-link.active { color: var(--accent); background: var(--accent-soft); }
  .nav-group { margin-top: 2px; }
  .nav-group > summary {
    cursor: pointer; list-style: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 5px 10px; border-radius: 6px; color: var(--muted); font-weight: 600;
  }
  .nav-group > summary::-webkit-details-marker { display: none; }
  .nav-group > summary:hover { background: var(--panel-hover); }
  .nav-group > summary .n-count { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .nav-group.active > summary { color: var(--accent); }
  .nav-items { display: flex; flex-direction: column; padding: 1px 0 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 7px;
    padding: 3.5px 10px 3.5px 18px; border-radius: 6px;
    color: var(--muted); font-weight: 400; font-size: 12.5px;
    white-space: nowrap;
  }
  .nav-item .dot { width: 6px; height: 6px; }
  .nav-item .n-title { overflow: hidden; text-overflow: ellipsis; }
  .nav-item:hover { background: var(--panel-hover); text-decoration: none; }
  .nav-item.active { color: var(--accent); background: var(--accent-soft); }
  .nav-sep { border: none; border-top: 1px solid var(--line); margin: 10px 10px; }
  main { flex: 1; min-width: 0; }

  /* ---------- Tier 1: board ---------- */
  .board-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .board-head h1 { font-size: 26px; }
  .board-head .sub { color: var(--muted); font-size: 13.5px; }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 13px 16px 11px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }
  .card-head:hover { background: var(--panel-hover); text-decoration: none; }
  .card-title { font-family: var(--serif); font-size: 16.5px; font-weight: 600; }
  .card-count {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: color-mix(in srgb, var(--neutral) 12%, transparent);
    padding: 1px 8px; border-radius: 999px;
  }
  .card-items { list-style: none; margin: 0; padding: 6px 0; flex: 1; }
  .card-item a {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 16px; color: var(--ink);
  }
  .card-item a:hover { background: var(--panel-hover); text-decoration: none; }
  .card-item .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .card-item.is-done .title { color: var(--muted); }
  .card-item .when { font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  .card-more {
    display: block; padding: 9px 16px 11px;
    border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted);
  }
  .card-more:hover { background: var(--panel-hover); color: var(--accent); text-decoration: none; }
  .card.ghost {
    border-style: dashed; border-color: var(--line-strong);
    background: transparent; box-shadow: none;
    align-items: center; justify-content: center;
    min-height: 180px; color: var(--faint);
    text-align: center; padding: 24px; gap: 6px;
  }
  .card.ghost .plus { font-size: 22px; line-height: 1; color: var(--line-strong); }
  .card.ghost .hint { font-size: 12.5px; max-width: 26ch; }

  /* ---------- Tier 2: card view / lists ---------- */
  .crumbs { font-size: 12.5px; color: var(--faint); margin: 2px 0 14px; }
  .crumbs a { color: var(--muted); }
  .crumbs .sep { margin: 0 6px; color: var(--line-strong); }
  .view-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .view-head h1 { font-size: 24px; }
  .view-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    padding: 4px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
    font-family: var(--sans);
  }
  .chip:hover { background: var(--panel-hover); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip[disabled] { opacity: 0.4; pointer-events: none; }
  .pager { display: flex; gap: 12px; align-items: center; margin-top: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .priv-btn {
    font-family: var(--mono); font-size: 11px; cursor: pointer;
    padding: 1.5px 8px; border-radius: 4px;
    border: 1px solid var(--line-strong); background: transparent; color: var(--faint);
  }
  .priv-btn:hover { color: var(--accent); border-color: var(--accent); }
  .priv-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: center;
    padding: 12px 16px; color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--panel-hover); text-decoration: none; }
  .row.no-status { grid-template-columns: 1fr auto; }
  .row .r-main { min-width: 0; }
  .row .r-title { font-weight: 600; font-size: 14.5px; }
  .row .r-summary { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .r-when { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
  .row .r-due { display: block; font-size: 10.5px; color: var(--muted); }
  .row .r-due.overdue { color: var(--blocked); font-weight: 700; }
  .rows-note { font-size: 12px; color: var(--faint); margin-top: 10px; }
  .empty { padding: 28px 16px; color: var(--faint); text-align: center; font-size: 13.5px; }

  /* ---------- Item view ---------- */
  .item-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0 22px; }
  .item-meta .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .item-meta .when.overdue { color: var(--blocked); font-weight: 700; }
  .item-meta .kind { font-family: var(--mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .human-flag {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    background: var(--accent-soft); padding: 2px 8px; border-radius: 4px;
  }
  section.block { margin-bottom: 26px; }
  .block-label {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 9px; font-family: var(--sans);
  }
  .summary-text { max-width: 68ch; font-size: 15px; color: var(--ink); margin: 0; }
  .human-note { max-width: 68ch; font-size: 12.5px; color: var(--faint); margin: 8px 0 0; }

  .checklist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .check { display: flex; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .check:last-child { border-bottom: none; }
  .check .mark { font-family: var(--mono); font-size: 13px; font-weight: 700; flex: none; width: 18px; text-align: center; }
  .check.done .mark { color: var(--done); }
  .check.in-flight .mark { color: var(--flight); }
  .check.blocked .mark { color: var(--blocked); }
  .check.todo .mark { color: var(--todo-mark); }
  .check.done .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .check .c-main { min-width: 0; }
  .check .blocker { display: block; font-size: 12.5px; color: var(--blocked); margin-top: 2px; }
  .check .blocker a { color: var(--blocked); font-weight: 600; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--blocked) 40%, transparent); }
  .check .c-links { display: block; font-size: 12.5px; margin-top: 2px; }

  .link-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .link-row { display: flex; align-items: baseline; gap: 10px; }
  .tag {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); background: color-mix(in srgb, var(--neutral) 12%, transparent);
    padding: 1.5px 7px; border-radius: 4px; flex: none; min-width: 44px; text-align: center;
  }
  .link-row .lr-note { font-size: 12.5px; color: var(--faint); }

  /* ---------- Doc view ---------- */
  .doc-body { max-width: 70ch; }
  .doc-body h2 { font-size: 19px; margin: 26px 0 10px; }
  .doc-body h3 { font-size: 16px; margin: 20px 0 8px; }
  .doc-body p { margin: 0 0 12px; }
  .doc-body ul { margin: 0 0 12px; padding-left: 22px; }
  .doc-body li { margin-bottom: 4px; }
  .doc-body code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0.5px 5px; }

  /* ---------- Agent view ---------- */
  details.agent { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.agent > summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  details.agent > summary::-webkit-details-marker { display: none; }
  details.agent > summary::before { content: "▸"; color: var(--faint); font-size: 11px; }
  details.agent[open] > summary::before { content: "▾"; }
  details.agent > summary:hover { color: var(--accent); }
  details.agent > summary .path { color: var(--accent); }
  .agent-file { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
  .agent-file .file-tab {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 7px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .agent-file pre {
    margin: 0; padding: 14px 16px; overflow-x: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--ink);
    tab-size: 2;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card-item a, .row, .chip, .card-head, .nav-link, .nav-item, .nav-group > summary { transition: background-color 120ms ease; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 0 16px 60px; }
    .layout { flex-direction: column; gap: 12px; }
    .sidenav { position: static; width: 100%; max-height: none; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .row { grid-template-columns: 1fr auto; }
    .row .pill { display: none; }
  }
</style>

<div class="wrap">
  <header class="topbar">
    <div class="topbar-left">
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-pressed="false" title="Toggle navigation">☰</button>
      <a class="wordmark" href="#/" aria-label="Arbiter dashboard">
        <svg class="seal" width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M15 2.5 L26 8.75 L26 21.25 L15 27.5 L4 21.25 L4 8.75 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="15" cy="15" r="3.2" fill="currentColor"/>
        </svg>
        <span class="wordmark-text">
          <span class="wordmark-name">Arbiter</span>
          <span class="wordmark-tag">Work, recorded. Impact, attested.</span>
        </span>

    <div class="topbar-meta">
      <span class="capture-stamp" id="capture-stamp"></span>
      <span class="legend" aria-label="Status legend">
        <span><i class="dot done"></i>done</span>
        <span><i class="dot in-flight"></i>in&#8209;flight</span>
        <span><i class="dot blocked"></i>blocked</span>
        <span><i class="dot todo"></i>todo</span>
        <span><i class="dot dropped"></i>dropped</span>
        <span><i class="dot needs-review"></i>needs&nbsp;review</span>
      </span>
    </div>
  </header>
  <div class="layout" id="layout">
    <nav class="sidenav" id="sidenav" aria-label="Fast navigation"></nav>
    <main id="app"></main>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= Sample data =================
     Shapes mirror the on-disk markdown format:
     PROTOCOL.md (agent contract), DASHBOARD.md (tier 1 index),
     <dir>/<id>.md (tier 2 item), <dir>/<id>/<doc>.md (tier 3 document). */

  var CARDS = [
    { type: "task",           label: "Tasks",           dir: "tasks",           extra: 5 },
    { type: "goal",           label: "Goals",           dir: "goals",           extra: 0 },
    { type: "meeting",        label: "Meetings",        dir: "meetings",        extra: 0 },
    { type: "journal",        label: "Journal",         dir: "journal",         extra: 3 },
    { type: "accomplishment", label: "Accomplishments", dir: "accomplishments", extra: 0 }
  ];

  var ITEMS = [
    /* ---- Tasks ---- */
    {

    "- `needs-review` is set by **triage**: at session start or on a status check, any item untouched for 14+ days that is not terminal gets `status: needs-review`. Resolve it by updating, dropping, or re-scoping the item.",

    "## Tier 1 — DASHBOARD.md (orientation)",
    "- Purpose: answer \"what happened recently, what should happen next\" in one read.",
    "- The index is regenerated programmatically by the app; its `generated:` frontmatter says how fresh it is. Treat a stale index as advisory and trust the item files.",

    "",
    "## Concurrent changes",
    "- Before writing, re-read the file (or heed the app's conflict signal). If it changed since your read, the altered context is relayed to you: merge your intent with the new state — negotiate, never blind-overwrite.",
    "",
    "## Human entries (repair rules)",
    "- Humans may drop minimal entries: a title line plus prose is a **valid** file. Do not reject or block on format.",
    "- Defaults when fields are missing: `status: todo`, `updated:` file modification date, `type:` taken from the parent directory.",
    "- On first touch, normalize: add frontmatter, infer status from the prose, move the original text under `## Summary` **unchanged**, and add `normalized: <date>` to frontmatter.",
    "- Never discard human prose. Repair, then continue with the actual task.",
    "",
    "## Visibility",
    "- Journal and meeting entries may carry `visibility: private`. Skip private items unless the user explicitly directs you to them, and never quote them into other contexts.",
    "",
    "## Accomplishments (attestation)",
    "- **Evidence is the driver**: every accomplishment must carry at least one verifiable link — a merged PR, a published doc, a dashboard — under `## Evidence`. Impact first, mechanism second, numbers where they exist.",
    "- When an item reaches `done`, distill a one-line, review-ready accomplishment into `accomplishments/` with evidence links back to the source item.",
    "- Accomplishment files are records, not work items: no status, never reopened. They age into the archive like everything else but are **never deleted** — reports search the archive.",
    "",
    "## Archive",
    "- Quarterly roll: terminal items and journal entries older than a quarter move to `archive/YYYY-qN/` with paths preserved. Recency-limited views never search the archive; reports and explicit lookups do.",
    "",
    "## Capture etiquette",
    "- Capture is cheap: one line appended now beats a perfect entry never written. Structure is added lazily on the next touch.",
    "- Prefer updating an existing item over creating a near-duplicate; apply the slug rule above first.",
    "- Every externally useful link (PR, design doc, dashboard) belongs in `## Artifacts` (or `## Evidence`) of the item it serves, not in prose."
  ].join("\n");

  function protocolRaw() {
    return [
      "---", "id: protocol", "version: 0.3", "---", "",
      "# Arbiter agent protocol", "", PROTOCOL_BODY
    ].join("\n");
  }

  var FOOTER = {
    tier1: "<!-- arbiter:tier-1 · PROTOCOL.md#tier-1 · entries end \"-> path\": open only the one path you need; do not bulk-read -->",
    tier2: "<!-- arbiter:tier-2 · PROTOCOL.md#tier-2 · manage this item in place; follow Detail docs pointers only when summary+checklist lack the answer; do not open siblings -->",
    tier3: "<!-- arbiter:tier-3 · PROTOCOL.md#tier-3 · full-context document; append with a dated heading, do not rewrite -->"
  };

  /* ================= Helpers ================= */

  var byId = {};
  ITEMS.forEach(function (it) { byId[it.id] = it; });
  var docById = {};
  DOCS.forEach(function (d) { docById[d.id] = d; });
  var cardByType = {};
  CARDS.forEach(function (c) { cardByType[c.type] = c; });

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function itemsOf(type) {
    return ITEMS.filter(function (it) { return it.type === type; })
      .sort(function (a, b) { return a.updated < b.updated ? 1 : -1; });
  }

  /* Tier-1 relevance ordering: active items by recency first, done items
     last; done items age off the card 7 days after completion. */
  var WEEK_MS = 7 * 24 * 3600 * 1000;
  var TERMINAL = { done: true, dropped: true };
  function recentForCard(type) {
    var now = Date.now();
    var all = itemsOf(type).filter(function (it) {
      return !TERMINAL[it.status] || (now - new Date(it.updated).getTime()) <= WEEK_MS;
    });
    var active = all.filter(function (it) { return !TERMINAL[it.status]; });
    var closed = all.filter(function (it) { return !!TERMINAL[it.status]; });
    return active.concat(closed);
  }

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function relTime(iso) {
    var then = new Date(iso), now = new Date();
    var mins = Math.max(0, Math.round((now - then) / 60000));
    if (mins < 60) return mins + "m ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    var days = Math.round(hrs / 24);
    if (days < 7) return days + "d ago";
    return MONTHS[then.getMonth()] + " " + then.getDate();
  }
  function shortDate(iso) {
    var d = new Date(iso);
    return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  function tinyDate(iso) {
    /* date-only strings must parse as local, not UTC midnight */
    var d = iso.length === 10
      ? new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10))
      : new Date(iso);
    return MONTHS[d.getMonth()] + " " + d.getDate();
  }
  function isoDate(iso) { return iso.slice(0, 10); }
  function isOverdue(it) {
    return !!it.due && it.status !== "done" &&
      new Date(it.due + "T23:59:59").getTime() < Date.now();
  }

  var STATUS_WORD = { done: "done", "in-flight": "in-flight", blocked: "blocked", todo: "todo", dropped: "dropped", "needs-review": "needs review" };
  function pill(status) {
    if (!status) return "";
    return '<span class="pill ' + status + '"><i class="dot ' + status + '"></i>' + STATUS_WORD[status] + "</span>";
  }
  var CHECK_MARK = { done: "✓", "in-flight": "◐", blocked: "!", todo: "○" };
  var MD_MARK = { done: "x", "in-flight": "~", blocked: "!", todo: " " };

  /* ---- Tiny markdown renderer (headings, lists, bold, code, links) ---- */
  function inlineMd(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  }
  function renderMd(md) {
    var out = [], list = null;
    md.split("\n").forEach(function (line) {
      if (/^- /.test(line)) {
        if (!list) { list = []; }
        list.push("<li>" + inlineMd(line.slice(2)) + "</li>");
        return;
      }
      if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
      if (/^### /.test(line)) out.push("<h3>" + inlineMd(line.slice(4)) + "</h3>");
      else if (/^## /.test(line)) out.push("<h2>" + inlineMd(line.slice(3)) + "</h2>");
      else if (line.trim() === "") { /* paragraph break */ }
      else out.push("<p>" + inlineMd(line) + "</p>");
    });
    if (list) out.push("<ul>" + list.join("") + "</ul>");
    return out.join("\n");
  }

  /* ---- Agent-facing markdown generators ---- */
  function itemPath(it) { return cardByType[it.type].dir + "/" + it.id + ".md"; }
  function docPath(d) {
    var parent = byId[d.itemId];
    return cardByType[parent.type].dir + "/" + parent.id + "/" + d.id + ".md";
  }

  function itemMd(it) {
    if (it.humanRaw) return it.humanRaw; /* un-normalized human entry: shown as-is */
    var L = [];
    L.push("---");
    L.push("id: " + it.id);
    L.push("type: " + it.type);
    L.push("title: " + it.title);
    if (it.status) L.push("status: " + it.status);
    if (it.started) L.push("started: " + it.started);
    if (it.eta) L.push("eta: " + it.eta);
    if (it.due) L.push("due: " + it.due);
    if (it.visibility) L.push("visibility: " + it.visibility);
    if (it.related && it.related.length) L.push("related: " + it.related.join(", "));
    L.push("updated: " + isoDate(it.updated));
    L.push("---");
    L.push("");
    L.push("# " + it.title);
    L.push("");
    L.push("## Summary");
    L.push(it.summary);
    if (it.checklist && it.checklist.length) {
      L.push("");
      L.push("## Checklist");
      it.checklist.forEach(function (c) {
        L.push("- [" + MD_MARK[c.status] + "] " + c.label);
        if (c.blocker) L.push("      blocked-by: [" + c.blocker.label + "](" + c.blocker.href + ")");
        (c.links || []).forEach(function (ln) {
          L.push("      see: [" + ln.label + "](" + ln.href + ")");
        });
      });
    }
    if (it.artifacts && it.artifacts.length) {
      L.push("");
      L.push(it.type === "accomplishment" ? "## Evidence" : "## Artifacts");
      it.artifacts.forEach(function (a) {
        L.push("- " + a.kind + ": [" + a.label + "](" + a.href + ")");
      });
    }
    if (it.docs && it.docs.length) {
      L.push("");
      L.push("## Detail docs");
      it.docs.forEach(function (id) {
        var d = docById[id];
        L.push("- [[" + d.id + "]] " + d.title + " (" + d.kind + ") -> " + docPath(d));
      });
    }
    L.push("");
    L.push(FOOTER.tier2);
    return L.join("\n");
  }

  function docMdRaw(d) {
    var L = [];
    L.push("---");
    L.push("id: " + d.id);
    L.push("kind: " + d.kind);
    L.push("item: " + d.itemId);
    L.push("updated: " + isoDate(d.updated));
    L.push("---");
    L.push("");
    L.push("# " + d.title);
    L.push("");
    L.push(d.md);
    L.push("");
    L.push(FOOTER.tier3);
    return L.join("\n");
  }

  function dashboardMd() {
    var L = [];
    L.push("---");
    L.push("updated: " + isoDate(ITEMS.reduce(function (m, it) { return it.updated > m ? it.updated : m; }, "")));
    L.push("generator: arbiter");
    L.push("generated: " + new Date().toISOString());
    L.push("protocol: PROTOCOL.md");
    L.push("---");
    L.push("");
    L.push("# Dashboard");
    L.push("");
    CARDS.forEach(function (card) {
      var eligible = recentForCard(card.type);
      var all = itemsOf(card.type);
      var total = all.length + card.extra;
      L.push("## " + card.label + " (" + total + ")");
      eligible.slice(0, 5).forEach(function (it) {
        var status = it.status ? "[" + it.status + "] " : "";
        L.push("- " + status + it.title + " — " + isoDate(it.updated) + " -> " + itemPath(it));
      });
      var shown = Math.min(eligible.length, 5);
      if (total > shown) {
        L.push("- +" + (total - shown) + " more in " + card.dir + "/");
      }
      L.push("");
    });
    L.push(FOOTER.tier1);
    return L.join("\n").trim();
  }

  function agentView(path, md) {
    return (
      '<details class="agent"><summary>View as agent — <span class="path">' + esc(path) + "</span></summary>" +
      '<div class="agent-file"><div class="file-tab">' + esc(path) + "</div>" +
      "<pre>" + esc(md) + "</pre></div></details>"
    );
  }

  function crumbs(parts) {
    return '<nav class="crumbs">' + parts.map(function (p) {
      return p.href ? '<a href="' + p.href + '">' + esc(p.label) + "</a>" : esc(p.label);
    }).join('<span class="sep">/</span>') + "</nav>";
  }

  /* ================= Views ================= */

  function viewDashboard() {
    var cardsHtml = CARDS.map(function (card) {
      var eligible = recentForCard(card.type);
      var shown = eligible.slice(0, 5);
      var total = itemsOf(card.type).length + card.extra;
      var more = total - shown.length;
      var itemsHtml = shown.map(function (it) {
        var dot = it.status ? '<i class="dot ' + it.status + '"></i>' : '<i class="dot logged"></i>';
        return (
          '<li class="card-item' + (TERMINAL[it.status] ? " is-done" : "") + '"><a href="#/item/' + it.id + '">' + dot +
          '<span class="title">' + esc(it.title) + "</span>" +
          '<span class="when">' + relTime(it.updated) + "</span></a></li>"
        );
      }).join("");
      var moreHtml = more > 0
        ? '<a class="card-more" href="#/card/' + card.type + '">+' + more + " more…</a>"
        : '<a class="card-more" href="#/card/' + card.type + '">Open ' + card.label.toLowerCase() + " →</a>";
      return (
        '<article class="card">' +
        '<a class="card-head" href="#/card/' + card.type + '">' +
        '<span class="card-title">' + card.label + "</span>" +
        '<span class="card-count">' + total + "</span></a>" +
        '<ul class="card-items">' + itemsHtml + "</ul>" + moreHtml +
        "</article>"
      );
    }).join("");

    var ghost =
      '<article class="card ghost" aria-hidden="true">' +
      '<span class="plus">+</span>' +
      '<span class="hint">Add a card type — Reviews, Incidents, Reading, anything worth attesting.</span>' +
      "</article>";

    return (
      '<div class="board-head"><h1>Dashboard</h1>' +
      '<span class="sub">Tier 1 — active first; done lingers 7 days</span></div>' +
      '<div class="board">' + cardsHtml + ghost + "</div>" +
      agentView("DASHBOARD.md", dashboardMd())
    );
  }

  function rowHtml(it, showStatus) {
    var summary = it.summary.length > 180 ? it.summary.slice(0, 177) + "…" : it.summary;
    var due = "";
    if (it.due && it.status !== "done") {
      due = '<span class="r-due' + (isOverdue(it) ? " overdue" : "") + '">due ' + tinyDate(it.due) + "</span>";
    }
    return (
      '<a class="row' + (showStatus ? "" : " no-status") + '" href="#/item/' + it.id + '">' +
      (showStatus ? pill(it.status) : "") +
      '<span class="r-main"><span class="r-title">' + esc(it.title) + "</span><br>" +
      '<span class="r-summary">' + esc(summary) + "</span></span>" +
      '<span class="r-when">' + relTime(it.updated) + due + "</span></a>"
    );
  }

  var PAGE_SIZE = 10;
  function viewCard(type, filter, page) {
    var card = cardByType[type];
    if (!card) return viewNotFound();
    var all = itemsOf(type);
    var hasStatus = all.some(function (it) { return !!it.status; });
    var filtered = filter && filter !== "all"
      ? all.filter(function (it) { return it.status === filter; })
      : all;
    var total = all.length + card.extra;

    var chipsHtml = "";
    if (hasStatus) {
      var opts = ["all", "done", "in-flight", "blocked", "todo", "dropped", "needs-review"];
      chipsHtml = '<div class="chips" role="group" aria-label="Filter by status">' + opts.map(function (o) {
        var active = (filter || "all") === o ? " active" : "";
        return '<button class="chip' + active + '" data-filter="' + o + '">' + (o === "all" ? "All" : STATUS_WORD[o]) + "</button>";
      }).join("") + "</div>";
    }

    /* Pagination: 10 per page. Journal is date-segmented — page 1 is the
       last 7 days, older entries follow in pages of 10. */
    var pageItems, pageCount, pageLabel = "", emptyMsg = "Nothing with that status right now.";
    if (type === "journal" && (!filter || filter === "all")) {
      var cutoff = Date.now() - WEEK_MS;
      var recent = filtered.filter(function (it) { return new Date(it.updated).getTime() >= cutoff; });
      var older = filtered.filter(function (it) { return new Date(it.updated).getTime() < cutoff; });
      pageCount = 1 + Math.ceil(older.length / PAGE_SIZE);
      page = Math.min(Math.max(1, page || 1), pageCount);
      pageItems = page === 1 ? recent : older.slice((page - 2) * PAGE_SIZE, (page - 1) * PAGE_SIZE);
      pageLabel = page === 1 ? "this week" : "older";
      if (page === 1) emptyMsg = "No entries in the last 7 days.";
    } else {
      pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      page = Math.min(Math.max(1, page || 1), pageCount);
      pageItems = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    }

    var rowsHtml = pageItems.length
      ? pageItems.map(function (it) { return rowHtml(it, hasStatus); }).join("")
      : '<div class="empty">' + emptyMsg + "</div>";

    var pager = "";
    if (pageCount > 1) {
      pager =
        '<div class="pager">' +
        '<button class="chip" data-page="' + (page - 1) + '"' + (page <= 1 ? " disabled" : "") + ">← Newer</button>" +
        "<span>Page " + page + " of " + pageCount + (pageLabel ? " — " + pageLabel : "") + "</span>" +
        '<button class="chip" data-page="' + (page + 1) + '"' + (page >= pageCount ? " disabled" : "") + ">Older →</button></div>";
    }

    var note = card.extra > 0
      ? '<p class="rows-note">' + card.extra + " older item" + (card.extra > 1 ? "s" : "") + " not included in this prototype’s sample data.</p>"
      : "";
    var sub = type === "journal"
      ? "Tier 2 — this week first; older entries in pages of " + PAGE_SIZE
      : "Tier 2 — every " + card.type + ", newest first, " + PAGE_SIZE + " per page";

    return (
      crumbs([{ label: "Dashboard", href: "#/" }, { label: card.label }]) +
      '<div class="view-head"><h1>' + card.label + "</h1>" +
      '<span class="card-count">' + total + "</span></div>" +
      '<p class="view-sub">' + sub + "</p>" +
      chipsHtml +
      '<div class="rows">' + rowsHtml + "</div>" + pager + note
    );
  }

  function checklistHtml(it) {
    if (!it.checklist || !it.checklist.length) return "";
    var lis = it.checklist.map(function (c) {
      var blocker = "";
      if (c.blocker) {
        var seg = c.blocker.note.split(c.blocker.label);
        blocker =
          '<span class="blocker">' + esc(seg[0]) +
          '<a href="' + c.blocker.href + '" target="_blank" rel="noopener">' + esc(c.blocker.label) + "</a>" +
          esc(seg[1] || "") + "</span>";
      }
      var links = (c.links || []).map(function (ln) {
        var ext = ln.href.charAt(0) === "#" ? "" : ' target="_blank" rel="noopener"';
        return '<a href="' + ln.href + '"' + ext + ">" + esc(ln.label) + "</a>";
      }).join(" · ");
      return (
        '<li class="check ' + c.status + '"><span class="mark" aria-hidden="true">' + CHECK_MARK[c.status] + "</span>" +
        '<span class="c-main"><span class="label">' + esc(c.label) + "</span>" +
        blocker + (links ? '<span class="c-links">see: ' + links + "</span>" : "") +
        "</span></li>"
      );
    }).join("");
    return '<section class="block"><div class="block-label">Checklist</div><ul class="checklist">' + lis + "</ul></section>";
  }

  function timeMetaHtml(it) {
    var bits = [];
    if (it.started) bits.push('<span class="when">started ' + tinyDate(it.started) + "</span>");
    if (it.eta) bits.push('<span class="when">est ' + tinyDate(it.eta) + "</span>");
    if (it.due) bits.push('<span class="when' + (isOverdue(it) ? " overdue" : "") + '">due ' + tinyDate(it.due) + (isOverdue(it) ? " — overdue" : "") + "</span>");
    return bits.join("");
  }

  function viewItem(id) {
    var it = byId[id];
    if (!it) return viewNotFound();
    var card = cardByType[it.type];

    var artifactsHtml = "";
    if (it.artifacts && it.artifacts.length) {
      artifactsHtml =
        '<section class="block"><div class="block-label">' + (it.type === "accomplishment" ? "Evidence" : "Artifacts") + '</div><ul class="link-rows">' +
        it.artifacts.map(function (a) {
          var ext = a.href.charAt(0) === "#" ? "" : ' target="_blank" rel="noopener"';
          return '<li class="link-row"><span class="tag">' + esc(a.kind) + '</span><a href="' + a.href + '"' + ext + ">" + esc(a.label) + "</a></li>";
        }).join("") + "</ul></section>";
    }

    var docsHtml = "";
    if (it.docs && it.docs.length) {
      docsHtml =
        '<section class="block"><div class="block-label">Detail docs — Tier 3</div><ul class="link-rows">' +
        it.docs.map(function (docId) {
          var d = docById[docId];
          return (
            '<li class="link-row"><span class="tag">' + esc(d.kind) + '</span>' +
            '<a href="#/doc/' + d.id + '">' + esc(d.title) + "</a>" +
            '<span class="lr-note">' + relTime(d.updated) + "</span></li>"
          );
        }).join("") + "</ul></section>";
    }

    var relatedHtml = "";
    if (it.related && it.related.length) {
      relatedHtml =
        '<section class="block"><div class="block-label">Related items</div><ul class="link-rows">' +
        it.related.map(function (rid) {
          var r = byId[rid];
          if (!r) return "";
          return (
            '<li class="link-row"><span class="tag">' + esc(r.type) + '</span>' +
            '<a href="#/item/' + r.id + '">' + esc(r.title) + "</a>" +
            (r.status ? '<span class="lr-note">' + STATUS_WORD[r.status] + "</span>" : "") + "</li>"
          );
        }).join("") + "</ul></section>";
    }

    var privBtn = (it.type === "journal" || it.type === "meeting")
      ? '<button class="priv-btn' + (it.visibility === "private" ? " on" : "") + '" data-item="' + it.id + '" title="Agents skip private items unless explicitly directed">private: ' + (it.visibility === "private" ? "on" : "off") + "</button>"
      : "";

    var humanFlag = it.humanRaw
      ? '<span class="human-flag">human entry · pending normalization</span>'
      : "";
    var humanNote = it.humanRaw
      ? '<p class="human-note">Captured as a raw note. Per PROTOCOL.md, the next agent touch will normalize it — add frontmatter, infer status, keep the prose unchanged.</p>'
      : "";

    return (
      crumbs([{ label: "Dashboard", href: "#/" }, { label: card.label, href: "#/card/" + card.type }, { label: it.title }]) +
      "<h1>" + esc(it.title) + "</h1>" +
      '<div class="item-meta">' + pill(it.status) +
      '<span class="when">updated ' + shortDate(it.updated) + "</span>" +
      timeMetaHtml(it) +
      '<span class="kind">' + card.type + "</span>" + privBtn + humanFlag + "</div>" +
      '<section class="block"><div class="block-label">Summary</div>' +
      '<p class="summary-text">' + esc(it.summary) + "</p>" + humanNote + "</section>" +
      checklistHtml(it) + artifactsHtml + docsHtml + relatedHtml +
      agentView(itemPath(it), itemMd(it))
    );
  }

  function viewDoc(id) {
    var d = docById[id];
    if (!d) return viewNotFound();
    var parent = byId[d.itemId];
    var card = cardByType[parent.type];
    return (
      crumbs([
        { label: "Dashboard", href: "#/" },
        { label: card.label, href: "#/card/" + card.type },
        { label: parent.title, href: "#/item/" + parent.id },
        { label: d.title }
      ]) +
      "<h1>" + esc(d.title) + "</h1>" +
      '<div class="item-meta"><span class="tag">' + esc(d.kind) + "</span>" +
      '<span class="when">updated ' + shortDate(d.updated) + "</span>" +
      '<span class="kind">tier 3</span></div>' +
      '<article class="doc-body">' + renderMd(d.md) + "</article>" +
      agentView(docPath(d), docMdRaw(d))
    );
  }

  function viewProtocol() {
    return (
      crumbs([{ label: "Dashboard", href: "#/" }, { label: "Agent protocol" }]) +
      "<h1>Agent protocol</h1>" +
      '<div class="item-meta"><span class="tag">protocol</span>' +
      '<span class="when">v0.3</span>' +
      '<span class="kind">contract</span></div>' +
      '<p class="view-sub">The one file an agent reads in full. Every other file carries a single scoped pointer line back to its section — tier instructions live here once, never repeated per file.</p>' +
      '<article class="doc-body">' + renderMd(PROTOCOL_BODY) + "</article>" +
      agentView("PROTOCOL.md", protocolRaw())
    );
  }

  function viewNotFound() {
    return crumbs([{ label: "Dashboard", href: "#/" }]) +
      '<h1>Not found</h1><p class="view-sub">Nothing recorded at this address. <a href="#/">Back to the dashboard.</a></p>';
  }

  /* ================= Sidenav ================= */

  var sidenav = document.getElementById("sidenav");

  function renderNav(hash) {
    var activeItem = null;
    var m1 = hash.match(/^#\/item\/(.+)$/);
    var m2 = hash.match(/^#\/doc\/(.+)$/);
    if (m1 && byId[m1[1]]) activeItem = byId[m1[1]];
    if (m2 && docById[m2[1]]) activeItem = byId[docById[m2[1]].itemId];
    var m3 = hash.match(/^#\/card\/(.+)$/);
    var activeType = activeItem ? activeItem.type : (m3 ? m3[1] : null);

    var groups = CARDS.map(function (card) {
      var isActiveGroup = card.type === activeType;
      var items = itemsOf(card.type).map(function (it) {
        var active = activeItem && activeItem.id === it.id ? " active" : "";
        var dot = it.status ? '<i class="dot ' + it.status + '"></i>' : '<i class="dot logged"></i>';
        return (
          '<a class="nav-item' + active + '" href="#/item/' + it.id + '">' + dot +
          '<span class="n-title">' + esc(it.title) + "</span></a>"
        );
      }).join("");
      var total = itemsOf(card.type).length + card.extra;
      return (
        '<details class="nav-group' + (isActiveGroup ? " active" : "") + '"' + (isActiveGroup ? " open" : "") + ">" +
        "<summary>" + card.label + ' <span class="n-count">' + total + "</span></summary>" +
        '<div class="nav-items">' + items + "</div></details>"
      );
    }).join("");

    sidenav.innerHTML =
      '<a class="nav-link' + (hash === "#/" || hash === "" ? " active" : "") + '" href="#/">Dashboard</a>' +
      groups +
      '<hr class="nav-sep">' +
      '<a class="nav-link' + (hash === "#/protocol" ? " active" : "") + '" href="#/protocol">Agent protocol</a>';
  }

  var layout = document.getElementById("layout");
  var navToggle = document.getElementById("nav-toggle");
  var navCollapsed = (window.innerWidth || 1200) < 720;
  function applyNav() {
    if (navCollapsed) layout.classList.add("nav-collapsed");
    else layout.classList.remove("nav-collapsed");
    navToggle.setAttribute("aria-pressed", String(!navCollapsed));
  }
  navToggle.addEventListener("click", function () {
    navCollapsed = !navCollapsed;
    applyNav();
  });
  applyNav();

  /* ================= Router ================= */

  var app = document.getElementById("app");
  var currentFilter = "all";
  var currentPage = 1;

  function route() {
    var hash = location.hash || "#/";
    var parts = hash.slice(2).split("/").filter(Boolean); /* strip "#/" */
    var html;
    if (parts.length === 0) html = viewDashboard();
    else if (parts[0] === "card" && parts[1]) { html = viewCard(parts[1], currentFilter, currentPage); }
    else if (parts[0] === "item" && parts[1]) html = viewItem(parts[1]);
    else if (parts[0] === "doc" && parts[1]) html = viewDoc(parts[1]);
    else if (parts[0] === "protocol") html = viewProtocol();
    else html = viewNotFound();
    app.innerHTML = html;
    renderNav(hash);
    window.scrollTo(0, 0);

    app.querySelectorAll(".chip[data-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentFilter = btn.getAttribute("data-filter");
        currentPage = 1;
        route();
      });
    });
    app.querySelectorAll(".chip[data-page]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentPage = parseInt(btn.getAttribute("data-page"), 10) || 1;
        route();
      });
    });
    app.querySelectorAll(".priv-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var it = byId[btn.getAttribute("data-item")];
        if (it) it.visibility = it.visibility === "private" ? null : "private";
        route();
      });
    });
  }

  window.addEventListener("hashchange", function () {
    if (!/^#\/card\//.test(location.hash)) currentFilter = "all";
    currentPage = 1;
    route();
  });

  /* Last-capture stamp = most recent item update */
  var latest = ITEMS.reduce(function (m, it) { return it.updated > m ? it.updated : m; }, "");
  document.getElementById("capture-stamp").innerHTML = "last capture <b>" + relTime(latest) + "</b>";

  route();
})();
</script>
