name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck + conformance gates 1-7
        run: npm test
      - name: validator green on the fixture corpus
        run: npm run --silent arbiter -- validate --data fixtures/arbiter-data
      # The in-repo arbiter-data/ is the FROZEN pre-split dogfood corpus (last
      # written 2026-07-16), kept as a conformance target. The live KB moved to
      # a sibling directory outside this repo in 29f4be2 — see CLAUDE.md.
      - name: validator green on the frozen dogfood corpus
        run: npm run --silent arbiter -- validate --data arbiter-data
